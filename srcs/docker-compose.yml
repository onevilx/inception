version: '3.8'

services:
  mariadb:
    build: ./requirements/mariadb
    restart: unless-stopped
    env_file: ../srcs/.env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_network

  wordpress:
    build: ./requirements/wordpress
    restart: unless-stopped
    env_file: ../srcs/.env
    volumes:
      - wordpress_files:/var/www/html
    depends_on:
      - mariadb
    networks:
      - inception_network

  nginx:
    build: ./requirements/nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - wordpress_files:/var/www/html:ro
    depends_on:
      - wordpress
    networks:
      - inception_network

volumes:
  mariadb_data:
  wordpress_files:

networks:
  inception_network:
    driver: bridge