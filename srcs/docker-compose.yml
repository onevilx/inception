services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    restart: on-failure
    env_file: .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_network

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    restart: on-failure
    env_file: .env
    volumes:
      - wordpress_files:/var/www/html
    depends_on:
      - mariadb
    networks:
      - inception_network

  nginx:
    build: ./requirements/nginx
    image: nginx:inception
    restart: on-failure
    ports:
      - "6969:443"
    volumes:
      - wordpress_files:/var/www/html:ro
    depends_on:
      - wordpress
    networks:
      - inception_network

volumes:
  mariadb_data:
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb

  wordpress_files:
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress

networks:
  inception_network:
    driver: bridge